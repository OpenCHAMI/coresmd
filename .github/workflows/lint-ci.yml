name: lint-ci
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-ci.yml@46b914cb1c1ad9fa4838a09a5f888135cdba9d06 # experimental: github-actions v4.0 pre-release (seantronsen/chore/cleanup)
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # zizmor SARIF upload to GHAS

  lint-ci:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }

name: build
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR Number to build (optional, for manual PR builds)'
        required: false
        type: string

permissions:
  contents: read   # baseline; jobs that need more request it below

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      rpm-unsigned: ${{ steps.names.outputs.rpm-unsigned }}
      rpm-signed:   ${{ steps.names.outputs.rpm-signed }}
      keys-public:  ${{ steps.names.outputs.keys-public }}
    steps:
      - id: names
        run: |
          {
            echo "rpm-unsigned=rpms-unsigned"
            echo "rpm-signed=rpms-signed"
            echo "keys-public=gpg-public-keys"
          } >> "$GITHUB_OUTPUT"

  build-goreleaser:
    permissions:
      contents: write      # release creation, uploading assets
      packages: write      # image push, container provenance
      id-token: write      # Sigstore signing (attest-build-provenance)
      attestations: write  # build provenance attestations
    uses: OpenCHAMI/github-actions/.github/workflows/build-publish-container-goreleaser.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    with:
      build-deps: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      cgo-enabled: 1
      is-pr-build: true
      go-version-file: go.mod
      registry-subject-name: ghcr.io/openchami/coresmd
      pr-number: ${{ inputs.pr-number || github.event.pull_request.number || 0 }}

  trivy:
    # Fork PRs build but don't push, so there is no image to scan.
    needs: [build-goreleaser]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: OpenCHAMI/github-actions/.github/workflows/trivy-image-scan.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # SARIF upload to GHAS
    with:
      image-ref: ghcr.io/openchami/coresmd:pr-${{ inputs.pr-number || github.event.pull_request.number || 0 }}
      exit-code: '0'  # report only until the baseline is reviewed

  build-makefile-binaries:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: 1
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install CoreDHCP generator
        run: go install github.com/coredhcp/coredhcp/cmds/coredhcp-generator@latest

      - name: Build with Make
        run: make

  build-makefile-container-multistage:
    # Container builds require a Docker daemon, which is unavailable on the
    # unprivileged ubuntu-slim runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: 1
          fetch-depth: 0
          persist-credentials: false

      - name: Build container from source using multi-stage build
        run: make container

  build:
    if: ${{ always() }}
    needs:
      - build-goreleaser
      - build-makefile-binaries
      - build-makefile-container-multistage
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with: { jobs: "${{ toJSON(needs) }}" }

  rpmbuild:
    needs: [config, build]
    uses: OpenCHAMI/github-actions/.github/workflows/build-rpm-quadlet.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}

  rpmsign:
    needs: [config, rpmbuild]
    uses: OpenCHAMI/github-actions/.github/workflows/gpg-sign-artifacts.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    secrets: inherit  # zizmor: ignore[secrets-inherit] gpg-sign-artifacts reads GPG secrets it doesn't declare
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys:   ${{ needs.config.outputs.keys-public }}

  rpmvalidate:
    needs: [config, rpmsign]
    uses: OpenCHAMI/github-actions/.github/workflows/validate-rpm-quadlet.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    with:
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      rpms: |
        - name: coresmd-*.rpm
          files:
            - /etc/openchami
            - /etc/openchami/configs
            - /etc/openchami/configs/coredhcp.yaml
            - /etc/openchami/configs/Corefile
            - /usr/share/containers/systemd/coresmd-.container.d
            - /usr/share/containers/systemd/coresmd-.container.d/10-defaults-shared.conf
            - /usr/share/containers/systemd/coresmd-coredhcp.container
            - /usr/share/containers/systemd/coresmd-coredhcp.container.d
            - /usr/share/containers/systemd/coresmd-coredhcp.container.d/10-defaults-service.conf
            - /usr/share/containers/systemd/coresmd-coredns.container
            - /usr/share/containers/systemd/coresmd-coredns.container.d
            - /usr/share/containers/systemd/coresmd-coredns.container.d/10-defaults-service.conf
            - /usr/share/licenses/coresmd-quadlet
            - /usr/share/licenses/coresmd-quadlet/MIT.txt

name: build
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to build (optional, for manual PR builds)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      rpm-unsigned: ${{ steps.names.outputs.rpm-unsigned }}
      rpm-signed:   ${{ steps.names.outputs.rpm-signed }}
      keys-public:  ${{ steps.names.outputs.keys-public }}
    steps:
      - id: names
        run: |
          {
            echo "rpm-unsigned=rpms-unsigned"
            echo "rpm-signed=rpms-signed"
            echo "keys-public=gpg-public-keys"
          } >> "$GITHUB_OUTPUT"

  build-goreleaser:
    uses: OpenCHAMI/github-actions/.github/workflows/build-publish-container-goreleaser.yml@8143942058adef1ce81a96a11ae9074358df4fbd # v3.11
    with:
      build_deps: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      cgo_enabled: 1
      is_pr_build: true
      go_version_file: go.mod
      registry_subject_name: ghcr.io/openchami/coresmd
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number || 0 }}

  build-makefile-binaries:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install CoreDHCP generator
        run: go install github.com/coredhcp/coredhcp/cmds/coredhcp-generator@latest

      - name: Build with Make
        run: make

  build-makefile-container-multistage:
    # Container builds require a Docker daemon, which is unavailable on the
    # unprivileged ubuntu-slim runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Build container from source using multi-stage build
        run: make container

  build:
    if: ${{ always() }}
    needs:
      - build-goreleaser
      - build-makefile-binaries
      - build-makefile-container-multistage
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify build jobs passed
        run: |
          [[ "${{ needs.build-goreleaser.result }}" == "success" ]]
          [[ "${{ needs.build-makefile-binaries.result }}" == "success" ]]
          [[ "${{ needs.build-makefile-container-multistage.result }}" == "success" ]]


  rpmbuild:
    needs: [config, build]
    uses: OpenCHAMI/github-actions/.github/workflows/build-rpm-quadlet.yml@8143942058adef1ce81a96a11ae9074358df4fbd # v3.11
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}

  rpmsign:
    needs: [config, rpmbuild]
    uses: OpenCHAMI/github-actions/.github/workflows/gpg-sign-artifacts.yml@8143942058adef1ce81a96a11ae9074358df4fbd # v3.11
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys:   ${{ needs.config.outputs.keys-public }}

  rpmvalidate:
    needs: [config, rpmsign]
    uses: OpenCHAMI/github-actions/.github/workflows/validate-rpm-quadlet.yml@8143942058adef1ce81a96a11ae9074358df4fbd # v3.11
    secrets: inherit
    with:
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      rpms: |
        - name: coresmd-*.rpm
          files:
            - /etc/openchami
            - /etc/openchami/configs
            - /etc/openchami/configs/coredhcp.yaml
            - /etc/openchami/configs/Corefile
            - /usr/share/containers/systemd/coresmd-.container.d
            - /usr/share/containers/systemd/coresmd-.container.d/10-defaults-shared.conf
            - /usr/share/containers/systemd/coresmd-coredhcp.container
            - /usr/share/containers/systemd/coresmd-coredhcp.container.d
            - /usr/share/containers/systemd/coresmd-coredhcp.container.d/10-defaults-service.conf
            - /usr/share/containers/systemd/coresmd-coredns.container
            - /usr/share/containers/systemd/coresmd-coredns.container.d
            - /usr/share/containers/systemd/coresmd-coredns.container.d/10-defaults-service.conf
            - /usr/share/licenses/coresmd-quadlet
            - /usr/share/licenses/coresmd-quadlet/MIT.txt

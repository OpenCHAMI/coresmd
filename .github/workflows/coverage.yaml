name: coverage
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    uses: OpenCHAMI/github-actions/.github/workflows/coverage-go.yml@8143942058adef1ce81a96a11ae9074358df4fbd # v3.11
    secrets: inherit
    with:
      go_version_file: go.mod
      coverage-command: make coverage
      coverage-file: coverage.out

  coverage:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |
          [[ "${{ needs.check.result }}" == "success" ]]

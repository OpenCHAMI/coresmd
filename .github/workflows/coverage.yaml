name: coverage
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    uses: OpenCHAMI/github-actions/.github/workflows/coverage-go.yml@c64b0b92899cdf2b24a5d6663d98db3ff37f8d84 # seantronsen/feat/add-missing-workflows
    secrets: inherit
    with:
      go_version_file: go.mod
      coverage-command: make coverage
      coverage-file: coverage.out

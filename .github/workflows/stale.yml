name: stale
on:
  schedule:
    - cron: '23 3 * * *'  # daily at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    uses: OpenCHAMI/github-actions/.github/workflows/stale.yml@5b8f3decfae1c29ef4004a6f49f1593d25eccc95 # experimental: github-actions v4.0 pre-release (seantronsen/feat/redesign-deployment)
    permissions:
      issues: write          # label, comment on, and close stale issues
      pull-requests: write   # label, comment on, and close stale PRs

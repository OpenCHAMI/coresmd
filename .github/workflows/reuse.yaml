name: reuse
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: OpenCHAMI/github-actions/.github/workflows/reuse.yml@8143942058adef1ce81a96a11ae9074358df4fbd # v3.11

  reuse:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |
          [[ "${{ needs.check.result }}" == "success" ]]

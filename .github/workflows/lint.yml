name: lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: Run golangci-lint
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1

  modules:
    name: Check Go modules
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum
        run: |
          make mod
          git diff --exit-code -- go.mod go.sum

  lint:
    name: lint
    if: ${{ always() }}
    needs:
      - golangci
      - modules
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify lint jobs passed
        run: |
          [[ "${{ needs.golangci.result }}" == "success" ]]
          [[ "${{ needs.modules.result }}" == "success" ]]

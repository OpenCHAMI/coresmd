name: release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read   # baseline; jobs that need more request it below

jobs:

  config:
    runs-on: ubuntu-latest
    outputs:
      rpm-unsigned: ${{ steps.names.outputs.rpm-unsigned }}
      rpm-signed:   ${{ steps.names.outputs.rpm-signed }}
      keys-public:  ${{ steps.names.outputs.keys-public }}
    steps:
      - id: names
        run: |
          {
            echo "rpm-unsigned=rpms-unsigned"
            echo "rpm-signed=rpms-signed"
            echo "keys-public=gpg-public-keys"
          } >> "$GITHUB_OUTPUT"

  build-goreleaser:
    permissions:
      contents: write      # release creation, uploading assets
      packages: write      # image push, container provenance
      id-token: write      # Sigstore signing (attest-build-provenance)
      attestations: write  # build provenance attestations
    uses: OpenCHAMI/github-actions/.github/workflows/build-publish-container-goreleaser.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    with:
      build-deps: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      cgo-enabled: 1
      is-pr-build: false
      go-version-file: go.mod
      registry-subject-name: ghcr.io/openchami/coresmd
      release-draft: true

  trivy:
    needs: [build-goreleaser]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: OpenCHAMI/github-actions/.github/workflows/trivy-image-scan.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # SARIF upload to GHAS
    with:
      image-ref: ghcr.io/openchami/coresmd:${{ github.ref_name }}
      exit-code: '0'  # report only until the baseline is reviewed

  rpmbuild:
    needs: [config, build-goreleaser]
    uses: OpenCHAMI/github-actions/.github/workflows/build-rpm-quadlet.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}

  rpmsign:
    needs: [config, rpmbuild]
    uses: OpenCHAMI/github-actions/.github/workflows/gpg-sign-artifacts.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    secrets: inherit  # zizmor: ignore[secrets-inherit] gpg-sign-artifacts reads GPG secrets it doesn't declare
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}
      artifact-name-signed-rpms: ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys: ${{ needs.config.outputs.keys-public }}

  release:
    needs: [config, rpmsign]
    permissions:
      contents: write   # create the GitHub Release and upload artifacts
    uses: OpenCHAMI/github-actions/.github/workflows/release-signed-artifacts.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)
    with:
      artifact-name-signed-rpms: ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys: ${{ needs.config.outputs.keys-public }}
      release-draft: true

  publish:
    needs: release
    permissions:
      contents: write   # publish the draft GitHub Release
    uses: OpenCHAMI/github-actions/.github/workflows/publish-release.yml@0c9d3259ca2dcc8bb93508ab70b7245ff6575b25 # experimental: github-actions v4.0 pre-release (seantronsen/feat/workflow-ports)

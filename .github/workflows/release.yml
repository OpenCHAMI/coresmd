name: release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:

  config:
    runs-on: ubuntu-latest
    outputs:
      rpm-unsigned: ${{ steps.names.outputs.rpm-unsigned }}
      rpm-signed:   ${{ steps.names.outputs.rpm-signed }}
      keys-public:  ${{ steps.names.outputs.keys-public }}
    steps:
      - id: names
        run: |
          {
            echo "rpm-unsigned=rpms-unsigned"
            echo "rpm-signed=rpms-signed"
            echo "keys-public=gpg-public-keys"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Release with Goreleaser
    uses: OpenCHAMI/github-actions/.github/workflows/build-publish-container-goreleaser.yml@c64b0b92899cdf2b24a5d6663d98db3ff37f8d84 # seantronsen/feat/add-missing-workflows
    with:
      build_deps: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      cgo_enabled: 1
      is_pr_build: false
      go_version_file: go.mod
      registry_subject_name: ghcr.io/openchami/coresmd
      release_draft: true

  rpmbuild:
    needs: [config, build]
    uses: OpenCHAMI/github-actions/.github/workflows/build-rpm-quadlet.yml@c64b0b92899cdf2b24a5d6663d98db3ff37f8d84 # seantronsen/feat/add-missing-workflows
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}

  rpmsign:
    needs: [config, rpmbuild]
    uses: OpenCHAMI/github-actions/.github/workflows/gpg-sign-artifacts.yml@c64b0b92899cdf2b24a5d6663d98db3ff37f8d84 # seantronsen/feat/add-missing-workflows
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}
      artifact-name-signed-rpms: ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys: ${{ needs.config.outputs.keys-public }}

  release:
    needs: [config, rpmsign]
    uses: OpenCHAMI/github-actions/.github/workflows/release-signed-artifacts.yml@c64b0b92899cdf2b24a5d6663d98db3ff37f8d84 # seantronsen/feat/add-missing-workflows
    secrets: inherit
    with:
      artifact-name-signed-rpms: ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys: ${{ needs.config.outputs.keys-public }}
      release_draft: true

  publish:
    needs: release
    uses: OpenCHAMI/github-actions/.github/workflows/publish-release.yml@c64b0b92899cdf2b24a5d6663d98db3ff37f8d84 # seantronsen/feat/add-missing-workflows
    secrets: inherit

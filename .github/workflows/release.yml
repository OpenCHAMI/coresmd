name: Release with GoReleaser

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    # Releases require Docker Buildx, which is unavailable on the unprivileged
    # ubuntu-slim runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -F tag_name="${{ github.ref_name }}" --jq .body > ../notes.md

      - name: Set build environment variables
        run: |
          {
            echo "GO_VERSION=$(go version | awk '{print $3}')"
            echo "BUILD_HOST=$(hostname)"
            echo "BUILD_USER=$(whoami)"
            echo "CGO_ENABLED=1"
          } >> "${GITHUB_ENV}"

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PR_BUILD: 'false'
        with:
          version: '~> v2'
          args: release --clean --release-notes ../notes.md
        id: goreleaser

      - name: Process GoReleaser output
        id: process_goreleaser_output
        run: |
          {
            echo "const fs = require('fs');"
            echo 'const artifacts = ${{ steps.goreleaser.outputs.artifacts }}'
            echo "const firstNonNullDigest = artifacts.find(artifact => artifact.extra && artifact.extra.Digest != null)?.extra.Digest;"
            echo "console.log(firstNonNullDigest);"
            echo "if (firstNonNullDigest) {"
            echo "  fs.writeFileSync('digest.txt', firstNonNullDigest);"
            echo "} else {"
            echo "  console.error('No digest found in artifacts');"
            echo "  process.exit(1);"
            echo "}"
          } > process.js
          node process.js
          echo "digest=$(cat digest.txt)" >> "${GITHUB_OUTPUT}"

      - name: Attest coredhcp binary linux_amd64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/coredhcp_linux_amd64_v3/coredhcp

      - name: Attest coredhcp binary linux_arm64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/coredhcp_linux_arm64_v8.0/coredhcp

      - name: Attest Docker container
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/openchami/coresmd
          subject-digest: ${{ steps.process_goreleaser_output.outputs.digest }}
          push-to-registry: true

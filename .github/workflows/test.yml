name: test
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  check:
    uses: OpenCHAMI/github-actions/.github/workflows/test-go.yml@8143942058adef1ce81a96a11ae9074358df4fbd # v3.11
    with:
      go_version_file: go.mod
      test-command: make test

  test:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |
          [[ "${{ needs.check.result }}" == "success" ]]

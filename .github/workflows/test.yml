name: test
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  test:
    uses: OpenCHAMI/github-actions/.github/workflows/test-go.yml@c64b0b92899cdf2b24a5d6663d98db3ff37f8d84 # seantronsen/feat/add-missing-workflows
    with:
      go_version_file: go.mod
      test-command: make test

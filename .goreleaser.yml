version: 2

project_name: coresmd
before:
  hooks:
  - go install github.com/coredhcp/coredhcp/cmds/coredhcp-generator@latest
  - coredhcp-generator -t generator/coredhcp/coredhcp.go.template -f generator/coredhcp/plugins.txt github.com/openchami/coresmd/plugin/coredhcp/coresmd github.com/openchami/coresmd/plugin/coredhcp/bootloop -o build/coredhcp/coredhcp.go
  - go mod tidy
  # Pin the packaged quadlets to the image this run publishes (:vX.Y.Z on
  # release, :pr-N on PR builds).
  - make quadlet-render IMAGE_TAG={{ .Tag }}

builds:
  # CoreDHCP build
  - id: coredhcp
    main: ./build/coredhcp/
    goos:  # CoreDHCP only supports linux
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
      - v1

    # If you want to build this locally, you can set the following environment variables:
    # export BUILD_HOST=$(hostname)
    # export GO_VERSION=$(go version | awk '{print $3}')
    # export BUILD_USER=$(whoami)
    ldflags:
      - "-s -w \
         -X github.com/openchami/coresmd/internal/version.GitCommit={{ .Commit }} \
         -X github.com/openchami/coresmd/internal/version.BuildTime={{ .Date }} \
         -X github.com/openchami/coresmd/internal/version.Version={{ .Version }} \
         -X github.com/openchami/coresmd/internal/version.GitBranch={{ .Branch }} \
         -X github.com/openchami/coresmd/internal/version.GitTag={{ .Tag }} \
         -X github.com/openchami/coresmd/internal/version.GitState={{ .GitTreeState }} \
         -X github.com/openchami/coresmd/internal/version.BuildHost={{ .Env.BUILD_HOST }} \
         -X github.com/openchami/coresmd/internal/version.GoVersion={{ .Env.GO_VERSION }} \
         -X github.com/openchami/coresmd/internal/version.BuildUser={{ .Env.BUILD_USER }} "
    binary: coredhcp
    env:
      # The bootloop plugin uses sqlite3 which requires CGO.
      - CGO_ENABLED=1
      - >-
        CC={{- if eq .Os "linux" -}}
            {{- if eq .Arch "amd64" -}}gcc{{- else -}}aarch64-linux-gnu-gcc{{- end -}}
        {{- end }}

  # CoreDNS build
  - id: coredns
    main: ./build/coredns/
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
      - v1

    ldflags:
      - "-s -w \
         -X github.com/openchami/coresmd/internal/version.GitCommit={{ .Commit }} \
         -X github.com/openchami/coresmd/internal/version.BuildTime={{ .Date }} \
         -X github.com/openchami/coresmd/internal/version.Version={{ .Version }} \
         -X github.com/openchami/coresmd/internal/version.GitBranch={{ .Branch }} \
         -X github.com/openchami/coresmd/internal/version.GitTag={{ .Tag }} \
         -X github.com/openchami/coresmd/internal/version.GitState={{ .GitTreeState }} \
         -X github.com/openchami/coresmd/internal/version.BuildHost={{ .Env.BUILD_HOST }} \
         -X github.com/openchami/coresmd/internal/version.GoVersion={{ .Env.GO_VERSION }} \
         -X github.com/openchami/coresmd/internal/version.BuildUser={{ .Env.BUILD_USER }} "
    binary: coredns
    env:
      - CGO_ENABLED=1
      - >-
        CC={{- if eq .Os "linux" -}}
            {{- if eq .Arch "amd64" -}}gcc{{- else -}}aarch64-linux-gnu-gcc{{- end -}}
        {{- end }}

dockers:
  - image_templates:
      - &amd64_linux_image "ghcr.io/openchami/{{.ProjectName}}:{{ .Tag }}-amd64"
      - "{{ if ne .Env.IS_PR_BUILD \"true\" }}ghcr.io/openchami/{{.ProjectName}}:{{ .Major }}-amd64{{ end }}"
      - "{{ if ne .Env.IS_PR_BUILD \"true\" }}ghcr.io/openchami/{{.ProjectName}}:{{ .Major }}.{{ .Minor }}-amd64{{ end }}"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    goarch: amd64
    goamd64: v3
    extra_files:
      - LICENSES/MIT.txt
      - README.md

  - image_templates:
      - &arm64v8_linux_image "ghcr.io/openchami/{{.ProjectName}}:{{ .Tag }}-arm64"
      - "{{ if ne .Env.IS_PR_BUILD \"true\" }}ghcr.io/openchami/{{.ProjectName}}:{{ .Major }}-arm64{{ end }}"
      - "{{ if ne .Env.IS_PR_BUILD \"true\" }}ghcr.io/openchami/{{.ProjectName}}:{{ .Major }}.{{ .Minor }}-arm64{{ end }}"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    extra_files:
      - LICENSES/MIT.txt
      - README.md
    goarch: arm64

docker_manifests:
  # For releases: latest + semantic versioning tags
  - name_template: "{{ if ne .Env.IS_PR_BUILD \"true\" }}ghcr.io/openchami/{{.ProjectName}}:latest{{ end }}"
    skip_push: "{{ eq .Env.IS_PR_BUILD \"true\" }}"
    image_templates:
      - *amd64_linux_image
      - *arm64v8_linux_image

  - name_template: "ghcr.io/openchami/{{.ProjectName}}:{{ .Tag }}"
    image_templates:
      - *amd64_linux_image
      - *arm64v8_linux_image

  - name_template: "{{ if ne .Env.IS_PR_BUILD \"true\" }}ghcr.io/openchami/{{.ProjectName}}:{{ .Major }}{{ end }}"
    skip_push: "{{ eq .Env.IS_PR_BUILD \"true\" }}"
    image_templates:
      - *amd64_linux_image
      - *arm64v8_linux_image

  - name_template: "{{ if ne .Env.IS_PR_BUILD \"true\" }}ghcr.io/openchami/{{.ProjectName}}:{{ .Major }}.{{ .Minor }}{{ end }}"
    skip_push: "{{ eq .Env.IS_PR_BUILD \"true\" }}"
    image_templates:
      - *amd64_linux_image
      - *arm64v8_linux_image

# Quadlet package, built as both rpm and deb. Per-format differences
# (release, dependency syntax) are under `overrides`; single-format files use
# `packager:` (overrides.<format>.contents would replace the whole list).
# Every file AND directory is listed so rpm owns (and removes) it, matching
# packaging/rpm-quadlet/coresmd-quadlet.spec.
nfpms:
  - id: quadlet
    package_name: coresmd-quadlet
    meta: true
    formats: [rpm, deb]
    # rpm: name-version-release.arch.rpm, deb: name_version-release_arch.deb
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/OpenCHAMI/coresmd
    maintainer: "Devon Bautista <devonb@lanl.gov>"
    description: Podman Quadlet unit files for running CoreSMD as part of an OpenCHAMI deployment.
    license: MIT
    vendor: OpenCHAMI
    section: admin
    contents:
      - dst: /etc/openchami
        type: dir
      - dst: /etc/openchami/configs
        type: dir
      # Real files, not the packaging/common/configs symlinks: nfpm packages a
      # symlink as a symlink (rpmbuild's cp -rL dereferenced them).
      - src: examples/coredhcp/coredhcp.yaml
        dst: /etc/openchami/configs/coredhcp.yaml
        type: "config|noreplace"
      - src: examples/coredns/basic/Corefile
        dst: /etc/openchami/configs/Corefile
        type: "config|noreplace"
      - dst: /usr/share/containers/systemd/coresmd-.container.d
        type: dir
      - src: packaging/common/systemd/coresmd-.container.d/10-defaults-shared.conf
        dst: /usr/share/containers/systemd/coresmd-.container.d/10-defaults-shared.conf
      - src: build/quadlet/coresmd-coredhcp.container
        dst: /usr/share/containers/systemd/coresmd-coredhcp.container
      - dst: /usr/share/containers/systemd/coresmd-coredhcp.container.d
        type: dir
      - src: packaging/common/systemd/coresmd-coredhcp.container.d/10-defaults-service.conf
        dst: /usr/share/containers/systemd/coresmd-coredhcp.container.d/10-defaults-service.conf
      - src: build/quadlet/coresmd-coredns.container
        dst: /usr/share/containers/systemd/coresmd-coredns.container
      - dst: /usr/share/containers/systemd/coresmd-coredns.container.d
        type: dir
      - src: packaging/common/systemd/coresmd-coredns.container.d/10-defaults-service.conf
        dst: /usr/share/containers/systemd/coresmd-coredns.container.d/10-defaults-service.conf
      - dst: /usr/share/licenses/coresmd-quadlet
        type: dir
        packager: rpm
      - src: LICENSES/MIT.txt
        dst: /usr/share/licenses/coresmd-quadlet/MIT.txt
        type: license
        packager: rpm
      - src: packaging/deb/copyright
        dst: /usr/share/doc/coresmd-quadlet/copyright
        packager: deb
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    overrides:
      rpm:
        release: "1.el9"
        dependencies:
          - podman >= 5.0.0
          - systemd
        suggests:
          - smd-quadlet >= 2.20.0
          - tokensmith-quadlet >= 0.4.0
          - openchami-haproxy-quadlet >= 0.0.1
      deb:
        release: "1"
        dependencies:
          - podman (>= 5.0.0)
          - systemd
        suggests:
          - smd-quadlet (>= 2.20.0)
          - tokensmith-quadlet (>= 0.4.0)
          - openchami-haproxy-quadlet (>= 0.0.1)
    rpm:
      signature:
        # Set by OpenCHAMI/github-actions build-release-goreleaser on tag
        # builds when a signing key is provided; unsigned when empty.
        key_file: "{{ .Env.GPG_KEY_PATH }}"

release:
  disable: "{{ if eq .Env.IS_PR_BUILD \"true\" }}true{{ else }}false{{ end }}"
  github:
    owner: OpenCHAMI
    name: coresmd
  draft: true
  name_template: "v{{ .Version }}"
  prerelease: auto
  mode: replace

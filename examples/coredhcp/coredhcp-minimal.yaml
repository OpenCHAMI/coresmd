# Minimal CoreDHCP configuration with CoreSMD plugin
# This configuration provides both DHCPv4 and DHCPv6 services for OpenCHAMI
# cluster components (dual-stack configuration)

###############################################################################
# DHCPv4 Configuration
###############################################################################

# Server configuration
server4:
  # Listen on all interfaces, port 67
  listen:
    - "0.0.0.0:67"

  plugins:
    # Server identity
    - server_id: 192.168.1.1

    # DNS servers
    - dns: 1.1.1.1 8.8.8.8

    # Gateway
    - router: 192.168.1.1

    # Network mask
    - netmask: 255.255.255.0

    # CoreSMD plugin for dynamic IP assignment
    - coresmd: |
        svc_base_uri=http://smd.cluster.local
        ipxe_uri=http://192.168.1.1:8081/bootscript
        cache_valid=30s
        lease_time=24h
        /* Rules (see examples/coredhcp/hostnames.md) */
        rule=type:Node,hostname:nid{04d}
        rule=type:HSNSwitch,hostname:{id}
        /* OPTIONAL: override built-in fallback hostname (default is unknown-{04d}) */
        rule=hostname:unknown-{04d}

###############################################################################
# DHCPv6 Configuration
###############################################################################

server6:
  # Listen on all IPv6-capable interfaces
  listen:
    - "[::]:547"

  plugins:
    # Server identity using link-layer DUID
    - server_id: LL 00:11:22:33:44:55

    # IPv6 DNS servers
    - dns: fd00::1 2001:4860:4860::8888

    # CoreSMD plugin for dynamic IPv6 assignment
    - coresmd: |
        svc_base_uri=http://smd.cluster.local
        ipxe_uri=http://[fd00::1]:8081/bootscript
        cache_valid=30s
        lease_time=24h
        /* Rules (see examples/coredhcp/hostnames.md) */
        rule=type:Node,hostname:nid{04d}
        rule=type:HSNSwitch,hostname:{id}
        /* OPTIONAL: override built-in fallback hostname (default is unknown-{04d}) */
        rule=hostname:unknown-{04d}
